# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: local
    hooks:
      - id: eslint
        name: eslint
        entry: npx eslint --fix
        language: system
        files: \.(vue|js|ts)$

  - repo: local
    hooks:
      - id: check-protected-branches
        name: check-protected-branches
        entry: ./.hooks/check-protected-branches.sh
        language: script
        stages: [pre-commit]
        pass_filenames: false
        always_run: true

  - repo: local
    hooks:
      - id: check-branch-naming
        name: check-branch-naming
        entry: ./.hooks/check-branch-naming.sh
        language: script
        stages: [pre-commit]
        pass_filenames: false
        always_run: true
